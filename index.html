
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Student Results Management</h1>

        <div class="card p-4 shadow">
            <h3>Add New Student</h3>

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" id="studentName" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 1</label>
                <input type="number" id="grade1" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 2</label>
                <input type="number" id="grade2" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 3</label>
                <input type="number" id="grade3" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Attendance</label>
                <input type="number" id="attendance" class="form-control">
            </div>

            <button id="addStudent" class="btn btn-primary">
                Add Student
            </button>

            <button id="mercyCommittee" class="btn btn-success mt-2">
                Activate Mercy Committee
            </button>
        </div>

        <div id="errorMessage" class="mt-3 text-danger"></div>

        <div class="mt-4">
            <h3>Students List</h3>
            <div id="studentsList"></div>
        </div>

        <div class="mt-4 mb-5">
            <h3>Final Report</h3>
            <div id="finalReport"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
